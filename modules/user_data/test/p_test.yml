global:
  scrape_interval: 15s #메트릭 검색 주기
  evaluation_interval: 15s # 이건 뭐지
  scrape_timeout: 10s

  external_labels:
    env: dev
    region: ap-northeast-3

scrape_configs:
  #############################
  # prometheus
  #############################
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  #############################
  # web
  #############################
  - job_name: nginx
    scrape_interval: 15s
    static_configs:
      - targets:
          - 10.0.1.10:9100
          - 10.0.1.11:9100
          - 10.0.2.10:9100

    labels:
      service: web
      team: infra

  #############################
  # 서버 추가 시, 추가 기입
  #############################
